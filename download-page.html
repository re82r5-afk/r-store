<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق المشروع | منصة AR</title>
    <style>
        
{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;}
      body {
          background-color: #05050a;
          color: #ffffff;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 20px;}.container {
          text-align: center;
          max-width: 500px;
          width: 100%;
          background: rgba(15, 15, 25, 0.8);
          border: 1px solid rgba(0, 122, 255, 0.3);
          border-radius: 20px;
          padding: 30px;
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
          backdrop-filter: blur(10px);}.logo-img {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid #007aff;
          margin-bottom: 20px;
          box-shadow: 0 0 20px rgba(0, 122, 255, 0.5);}
      h2 {
          font-size: 22px;
          margin-bottom: 10px;}
      p {
          color: #a0a0ba;
          font-size: 14px;
          margin-bottom: 25px;
          line-height: 1.6;}.install-btn {
          display: block;
          width: 100%;
          padding: 15px;
          background: linear-gradient(135deg, #0051ff, #00c6ff);
          color: #ffffff;
          border: none;
          border-radius: 12px;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          text-decoration: none;
          box-shadow: 0 4px 20px rgba(0, 81, 255, 0.5);
          transition: all 0.3s ease;
          margin-bottom: 15px;}.install-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 25px rgba(0, 198, 255, 0.7);}.note {
          color: #ff3b30;
          font-size: 12px;
          margin-top: 15px;}</style>
</head>
<body>

    <div class="container">
        <!-- شعار AR -->
        <img src="logo.png" alt="AR Logo" class="logo-img">

        <h2>أنت جاهز الآن للتحميل</h2>
        <p>تم التحقق من اشتراكك بنجاح. اضغط على الزر أدناه لتثبيت تطبيق المشروع الرئيسي على جهازك الآيفون.</p>

        <!-- زر التحميل المباشر المربوط بروتوكول أبل -->
        <a href="itms-services://?action=download-manifest&url=رابطملفالـالبيستالخاص بك" class="install-btn">تثبيت التطبيق الآن</a>

        <div class="note">ملاحظة: بعد انتهاء التحميل، توجه إلى الإعدادات ثم عام لإعطاء صلاحية الوثوق بالتطبيق.</div>
    </div>

</body>
</html>
